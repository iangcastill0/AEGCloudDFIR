# Authentik blueprint: AEG-CloudDFIR OIDC application.
# Mounted at /blueprints/custom in the compose stack; Authentik applies it on
# startup. The client secret is read from the AUTHENTIK bootstrap env var
# CDFIR_OIDC_CLIENT_SECRET_BOOTSTRAP if set, else generate one in the UI and copy
# it into AEG-CloudDFIR's CDFIR_OIDC_CLIENT_SECRET.
version: 1
metadata:
  name: cdfir
  labels:
    blueprints.goauthentik.io/description: 'AEG-CloudDFIR OIDC provider + application'
entries:
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: cdfir
    attrs:
      name: cdfir
      client_type: confidential
      client_id: cdfir
      client_secret: !Env [CDFIR_OIDC_CLIENT_SECRET_BOOTSTRAP, 'changeme-local-only']
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          # Must equal the API's public origin + /auth/callback. Authentik
          # matches this strictly, so a stale value fails the flow at the IdP
          # with no useful error in the application's logs.
          url:
            !Env [
              CDFIR_OIDC_REDIRECT_URI,
              'http://localhost:4000/auth/callback',
            ]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_code_validity: minutes=1
      access_token_validity: minutes=10
      refresh_token_validity: days=1
      sub_mode: hashed_user_id # stable pairwise-ish sub; AEG-CloudDFIR keys on (issuer, sub)
      include_claims_in_id_token: true
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'openid'"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'email'"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'profile'"],
          ]
  - model: authentik_core.application
    identifiers:
      slug: cdfir
    attrs:
      name: AEG-CloudDFIR
      slug: cdfir
      provider: !KeyOf cdfir
      policy_engine_mode: any
      meta_description: 'eDiscovery evidence archive'
      # Without this, the tile on Authentik's "My applications" page falls back
      # to a URL derived from the provider's redirect URI — the API origin —
      # where the root path serves a 404 rather than starting a login. Point it
      # at the login initiator so the tile begins a real OIDC flow (state, nonce
      # and PKCE are minted by the API, not by the tile).
      meta_launch_url:
        !Env [
          CDFIR_OIDC_LAUNCH_URL,
          'http://localhost:4000/auth/login?redirectTo=%2F',
        ]
      meta_publisher: 'AEG'
  # Optional groups used for group→role mapping (CDFIR_OIDC_GROUP_CLAIM=groups,
  # CDFIR_OIDC_GROUP_ROLE_MAP=cdfir-org-admins:org_admin,cdfir-reviewers:reviewer,...)
  - model: authentik_core.group
    identifiers: { name: cdfir-org-admins }
    attrs: { name: cdfir-org-admins }
  - model: authentik_core.group
    identifiers: { name: cdfir-reviewers }
    attrs: { name: cdfir-reviewers }
  - model: authentik_core.group
    identifiers: { name: cdfir-case-managers }
    attrs: { name: cdfir-case-managers }
