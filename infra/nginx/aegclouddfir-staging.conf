# Staging: staging.aegclouddfir.com (web) and api-staging.aegclouddfir.com (API).
#
# Install on the server as /etc/nginx/sites-available/aegclouddfir-staging,
# symlink into sites-enabled, then let certbot add the TLS listeners:
#   sudo certbot --nginx -d staging.aegclouddfir.com -d api-staging.aegclouddfir.com
#
# Two hosts rather than one, mirroring production, because the session cookie
# uses the __Host- prefix: it is scoped to exactly one host with no Domain
# attribute, so the API must own its own name.
#
# Staging is a real deployment on the public internet. It carries a noindex
# header so search engines never list it, and its own sign-in — but it holds no
# real evidence: its database, its Redis, its search index and its file storage
# are all separate from production.

# --- Staging web UI ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name staging.aegclouddfir.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Keep staging out of search results. It looks like the real product and
        # should never be the result someone finds.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# --- Staging API -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api-staging.aegclouddfir.com;

    # Same upload allowance as production, or staging cannot exercise the one
    # path most likely to break: a large PST.
    client_max_body_size 11G;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
