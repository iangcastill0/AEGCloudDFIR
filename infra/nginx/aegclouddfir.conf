# AEG-CloudDFIR — nginx site for app / api / auth on aegclouddfir.com
#
# Deliberately HTTP-only. `certbot --nginx` rewrites these blocks in place:
# it adds `listen 443 ssl`, the certificate paths, and (when asked) the
# HTTP->HTTPS redirect. Writing the 443 blocks by hand first would make
# `nginx -t` fail, because the certificates do not exist until certbot runs.
#
# Coexists with the existing eclouddiscovery.net site on this server; nothing
# is shared between them. Install:
#   sudo cp infra/nginx/aegclouddfir.conf /etc/nginx/sites-available/aegclouddfir
#
# NOTE: once certbot has run, the INSTALLED copy of this file contains the
# ssl_certificate directives certbot added. Do not overwrite it with this
# template afterwards — you would remove TLS. This file is the pre-certbot
# starting point; the apex redirect lives in aegclouddfir-apex.conf.
#   sudo ln -s /etc/nginx/sites-available/aegclouddfir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.aegclouddfir.com -d api.aegclouddfir.com -d auth.aegclouddfir.com

# $connection_upgrade is not built into nginx; this map defines it. `map` is an
# http-context directive and site files are included inside http{}, so keeping
# it here makes the file self-contained. Verified that nothing else on this
# server defines the same variable (a duplicate would fail `nginx -t`).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Web UI (Next.js, container port 3000) -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.aegclouddfir.com;

    # Let certbot answer HTTP-01 challenges from disk.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# --- API (NestJS/Fastify, container port 4000) -------------------------------
# CDFIR_TRUST_PROXY=true makes the API trust the X-Forwarded-* headers below,
# so audit events record the real client IP rather than 127.0.0.1.
server {
    listen 80;
    listen [::]:80;
    server_name api.aegclouddfir.com;

    # PST/OST uploads. nginx defaults to 1 MB and would reject every upload
    # with 413. Keep this >= CDFIR_UPLOAD_MAX_BYTES (default 10 GiB).
    client_max_body_size 11G;
    # Stream the body straight through: the API hashes bytes as they arrive and
    # never buffers whole files, so spooling to disk here would only add I/O.
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Authentik (identity provider, container port 9443) ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name auth.aegclouddfir.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authentik uses websockets for outpost connections.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
