# AEG-CloudDFIR — redirect the bare domain and www to the canonical app host.
#
# Kept in its own file so it can be installed without touching the
# certbot-managed aegclouddfir site file. The TLS block references the existing
# certificate, which already covers aegclouddfir.com and www.aegclouddfir.com
# (issued with: certbot --nginx --expand -d app... -d api... -d auth...
# -d aegclouddfir.com -d www.aegclouddfir.com), so no certbot run is needed to
# enable this — just install and reload:
#
#   sudo cp infra/nginx/aegclouddfir-apex.conf /etc/nginx/sites-available/aegclouddfir-apex
#   sudo ln -s /etc/nginx/sites-available/aegclouddfir-apex /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name aegclouddfir.com www.aegclouddfir.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Front door: the public sign-up page on the app host. Authentik still
    # creates the account after they click Create account. Do not send this
    # through /auth/login: that starts OIDC immediately and a leftover
    # Authentik session is adopted with no picker.
    location / {
        return 302 https://app.aegclouddfir.com/signup;
    }
}

# 302, not 301, throughout this file. Browsers cache permanent redirects
# aggressively and per-user, so a 301 here is effectively irreversible: every
# visitor who ever hit the apex would keep bypassing it, making it impossible to
# later serve a landing page at the bare domain without stale caches fighting
# you. These targets are entry points, not permanent relocations of a resource.

# --- admin.aegclouddfir.com -> Authentik admin dashboard ---------------------
# A redirect, not a proxy: Authentik is already reachable at auth. and its
# session cookies are host-scoped, so serving the same instance under a second
# hostname would split sessions and break flows mid-login. This gives a
# memorable admin URL while Authentik keeps enforcing its own authentication
# (plus whatever MFA policy the flow requires).
server {
    listen 80;
    listen [::]:80;
    server_name admin.aegclouddfir.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 302 https://auth.aegclouddfir.com/if/admin/; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.aegclouddfir.com;

    ssl_certificate     /etc/letsencrypt/live/app.aegclouddfir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aegclouddfir.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / { return 302 https://auth.aegclouddfir.com/if/admin/; }
}

server {
    # nginx 1.24 (this server) enables HTTP/2 on the listen line; the separate
    # `http2 on;` directive only exists from 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aegclouddfir.com www.aegclouddfir.com;

    # Same certificate as the app/api/auth hosts — it carries all five names.
    ssl_certificate     /etc/letsencrypt/live/app.aegclouddfir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aegclouddfir.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # $request_uri is deliberately dropped: this is the public door, not a
    # path-preserving alias. Deep links belong on app.aegclouddfir.com.
    # Same rule as the :80 block: land on /signup, do not start OIDC here.
    location / {
        return 302 https://app.aegclouddfir.com/signup;
    }
}
