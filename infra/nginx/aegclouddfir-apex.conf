# AEG-CloudDFIR — redirect the bare domain and www to the canonical app host.
#
# Kept in its own file so it can be installed without touching the
# certbot-managed aegclouddfir site file. The TLS block references the existing
# certificate, which already covers aegclouddfir.com and www.aegclouddfir.com
# (issued with: certbot --nginx --expand -d app... -d api... -d auth...
# -d aegclouddfir.com -d www.aegclouddfir.com), so no certbot run is needed to
# enable this — just install and reload:
#
#   sudo cp infra/nginx/aegclouddfir-apex.conf /etc/nginx/sites-available/aegclouddfir-apex
#   sudo ln -s /etc/nginx/sites-available/aegclouddfir-apex /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name aegclouddfir.com www.aegclouddfir.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.aegclouddfir.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aegclouddfir.com www.aegclouddfir.com;

    # Same certificate as the app/api/auth hosts — it carries all five names.
    ssl_certificate     /etc/letsencrypt/live/app.aegclouddfir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aegclouddfir.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://app.aegclouddfir.com$request_uri;
    }
}
