# EvidenceVault full local development stack.
#   docker compose -f infra/compose/docker-compose.yml up -d
# Credentials below are LOCAL-ONLY defaults; production deployments must
# override every one of them (see .env.example and docs/guides/).

name: evidencevault

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evidencevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EV_LOCAL_PG_SUPER_PASSWORD:-changeme-local-only}
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d evidencevault']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true' # local dev only; enable + TLS in prod
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${EV_LOCAL_OS_ADMIN_PASSWORD:-LocalDev!ChangeMe1}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - '127.0.0.1:9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${EV_LOCAL_MINIO_PASSWORD:-minioadmin-local-only}
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin $${MINIO_ROOT_PASSWORD:-minioadmin-local-only} &&
      mc mb --ignore-existing local/ev-evidence &&
      mc mb --ignore-existing local/ev-quarantine &&
      mc version enable local/ev-evidence || true"
    environment:
      MINIO_ROOT_PASSWORD: ${EV_LOCAL_MINIO_PASSWORD:-minioadmin-local-only}

  clamav:
    # clamav-debian is the multi-arch (amd64+arm64) distribution of the same release
    image: clamav/clamav-debian:1.4
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - '127.0.0.1:3310:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  tika:
    image: apache/tika:2.9.2.1-full
    ports:
      - '127.0.0.1:9998:9998'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9998/tika >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20

  authentik-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${EV_LOCAL_AUTHENTIK_PG_PASSWORD:-changeme-local-only}
    volumes:
      - authentik-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authentik']
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.4
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${EV_LOCAL_AUTHENTIK_SECRET:-local-dev-secret-generate-your-own-0000}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${EV_LOCAL_AUTHENTIK_PG_PASSWORD:-changeme-local-only}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${EV_LOCAL_AUTHENTIK_ADMIN_PASSWORD:-admin-local-only}
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@localhost
    volumes:
      - ../authentik/blueprints:/blueprints/custom:ro
    ports:
      - '127.0.0.1:9443:9000'
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.4
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${EV_LOCAL_AUTHENTIK_SECRET:-local-dev-secret-generate-your-own-0000}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${EV_LOCAL_AUTHENTIK_PG_PASSWORD:-changeme-local-only}
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - ../authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../../.env
    environment:
      EV_DATABASE_URL: postgresql://evidencevault:changeme-local-only@postgres:5432/evidencevault
      EV_DATABASE_MIGRATION_URL: postgresql://evidencevault_migrator:changeme-local-only@postgres:5432/evidencevault
      EV_REDIS_URL: redis://redis:6379
      EV_OPENSEARCH_URL: http://opensearch:9200
      EV_S3_ENDPOINT: http://minio:9000
      EV_CLAMAV_HOST: clamav
      EV_TIKA_URL: http://tika:9998
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['app']

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ../../.env
    environment:
      EV_DATABASE_URL: postgresql://evidencevault:changeme-local-only@postgres:5432/evidencevault
      EV_REDIS_URL: redis://redis:6379
      EV_OPENSEARCH_URL: http://opensearch:9200
      EV_S3_ENDPOINT: http://minio:9000
      EV_CLAMAV_HOST: clamav
      EV_TIKA_URL: http://tika:9998
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['app']

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    env_file: ../../.env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
    profiles: ['app']

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
  minio-data:
  clamav-data:
  authentik-pg-data:
