# AEG-CloudDFIR full local development stack.
#   docker compose -f infra/compose/docker-compose.yml up -d
# Credentials below are LOCAL-ONLY defaults; production deployments must
# override every one of them (see .env.example and docs/guides/).
#
# Host port bindings are env-driven (CDFIR_*_HOST_PORT) because a shared server
# may already run something on the defaults. Containers always reach each other
# on the compose network by service name, so these mappings exist only for
# host-side tooling — on a shared host, move them to free high ports.
#
# ALWAYS run compose from the repo root (as in the command above) or pass
# --env-file ../../.env. Compose interpolates ${...} from the .env in the
# CURRENT directory, not from the service env_file below: run it from inside
# this directory with no --env-file and every default here silently applies —
# the host ports collide with whatever else the server runs, and the database
# password becomes changeme-local-only. Deployments symlink .env into this
# directory so either invocation works.

name: cdfir

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdfir
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CDFIR_LOCAL_PG_SUPER_PASSWORD:-changeme-local-only}
      # Password for the cdfir/cdfir_migrator roles created by init/postgres.
      # Only applied on FIRST start (empty data volume) — set it before the very
      # first `up`, or change it later with ALTER ROLE.
      CDFIR_DB_PASSWORD: ${CDFIR_DB_PASSWORD:-changeme-local-only}
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${CDFIR_PG_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cdfir']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${CDFIR_REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true' # local dev only; enable + TLS in prod
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${CDFIR_LOCAL_OS_ADMIN_PASSWORD:-LocalDev!ChangeMe1}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - '127.0.0.1:${CDFIR_OPENSEARCH_HOST_PORT:-9200}:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${CDFIR_LOCAL_MINIO_PASSWORD:-minioadmin-local-only}
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:${CDFIR_MINIO_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${CDFIR_MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin $${MINIO_ROOT_PASSWORD:-minioadmin-local-only} &&
      mc mb --ignore-existing local/cdfir-evidence &&
      mc mb --ignore-existing local/cdfir-quarantine &&
      mc version enable local/cdfir-evidence || true"
    environment:
      MINIO_ROOT_PASSWORD: ${CDFIR_LOCAL_MINIO_PASSWORD:-minioadmin-local-only}

  clamav:
    # clamav-debian is the multi-arch (amd64+arm64) distribution of the same release
    image: clamav/clamav-debian:1.4
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - '127.0.0.1:${CDFIR_CLAMAV_HOST_PORT:-3310}:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  tika:
    image: apache/tika:2.9.2.1-full
    ports:
      - '127.0.0.1:${CDFIR_TIKA_HOST_PORT:-9998}:9998'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9998/tika >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20

  authentik-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${CDFIR_LOCAL_AUTHENTIK_PG_PASSWORD:-changeme-local-only}
    volumes:
      - authentik-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authentik']
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.4
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${CDFIR_LOCAL_AUTHENTIK_SECRET:-local-dev-secret-generate-your-own-0000}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${CDFIR_LOCAL_AUTHENTIK_PG_PASSWORD:-changeme-local-only}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${CDFIR_LOCAL_AUTHENTIK_ADMIN_PASSWORD:-admin-local-only}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${CDFIR_AUTHENTIK_ADMIN_EMAIL:-akadmin@localhost}
      # Consumed by the blueprint's !Env lookups. Derived from the API's public
      # URL so the callback and launch URLs cannot drift from where the API
      # actually lives. CDFIR_OIDC_CLIENT_SECRET_BOOTSTRAP MUST equal the API's
      # CDFIR_OIDC_CLIENT_SECRET: the blueprint is authoritative for the
      # provider, so a mismatch silently rotates the secret out from under the
      # API and every login fails at the token exchange.
      CDFIR_OIDC_CLIENT_SECRET_BOOTSTRAP: ${CDFIR_OIDC_CLIENT_SECRET:-changeme-local-only}
      CDFIR_OIDC_REDIRECT_URI: ${CDFIR_API_PUBLIC_URL:-http://localhost:4000}/auth/callback
      CDFIR_OIDC_LAUNCH_URL: ${CDFIR_API_PUBLIC_URL:-http://localhost:4000}/auth/login?redirectTo=%2F
    volumes:
      - ../authentik/blueprints:/blueprints/custom:ro
    ports:
      - '127.0.0.1:${CDFIR_AUTHENTIK_HOST_PORT:-9443}:9000'
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.4
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${CDFIR_LOCAL_AUTHENTIK_SECRET:-local-dev-secret-generate-your-own-0000}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${CDFIR_LOCAL_AUTHENTIK_PG_PASSWORD:-changeme-local-only}
      AUTHENTIK_REDIS__HOST: authentik-redis
      # These MUST be on the worker, not only the server: the worker runs the
      # migrations that create akadmin, and the bootstrap values are read there.
      # With them on the server alone, akadmin is created with no usable password
      # and the default root@example.com address, locking everyone out of the
      # admin console. They apply only on first start against an empty database —
      # an existing deployment needs `ak create_recovery_key` instead (see
      # docs/guides/first-admin.md).
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${CDFIR_LOCAL_AUTHENTIK_ADMIN_PASSWORD:-admin-local-only}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${CDFIR_AUTHENTIK_ADMIN_EMAIL:-akadmin@localhost}
      # Consumed by the blueprint's !Env lookups. Derived from the API's public
      # URL so the callback and launch URLs cannot drift from where the API
      # actually lives. CDFIR_OIDC_CLIENT_SECRET_BOOTSTRAP MUST equal the API's
      # CDFIR_OIDC_CLIENT_SECRET: the blueprint is authoritative for the
      # provider, so a mismatch silently rotates the secret out from under the
      # API and every login fails at the token exchange.
      CDFIR_OIDC_CLIENT_SECRET_BOOTSTRAP: ${CDFIR_OIDC_CLIENT_SECRET:-changeme-local-only}
      CDFIR_OIDC_REDIRECT_URI: ${CDFIR_API_PUBLIC_URL:-http://localhost:4000}/auth/callback
      CDFIR_OIDC_LAUNCH_URL: ${CDFIR_API_PUBLIC_URL:-http://localhost:4000}/auth/login?redirectTo=%2F
    volumes:
      - ../authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../../.env
    environment:
      CDFIR_DATABASE_URL: postgresql://cdfir:${CDFIR_DB_PASSWORD:-changeme-local-only}@postgres:5432/cdfir
      CDFIR_DATABASE_MIGRATION_URL: postgresql://cdfir_migrator:${CDFIR_DB_PASSWORD:-changeme-local-only}@postgres:5432/cdfir
      CDFIR_REDIS_URL: redis://redis:6379
      CDFIR_OPENSEARCH_URL: http://opensearch:9200
      # Defaults to the bundled MinIO for local development, but MUST stay
      # overridable: unlike the datastores below, object storage is genuinely
      # external in production (Wasabi). Hardcoding it silently overrode .env and
      # sent Wasabi credentials to the MinIO container, which answers
      # InvalidAccessKeyId — a confusing error for a config precedence problem.
      CDFIR_S3_ENDPOINT: ${CDFIR_S3_ENDPOINT:-http://minio:9000}
      CDFIR_CLAMAV_HOST: clamav
      CDFIR_TIKA_URL: http://tika:9998
    ports:
      - '127.0.0.1:${CDFIR_API_HOST_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['app']

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ../../.env
    environment:
      CDFIR_DATABASE_URL: postgresql://cdfir:${CDFIR_DB_PASSWORD:-changeme-local-only}@postgres:5432/cdfir
      CDFIR_REDIS_URL: redis://redis:6379
      CDFIR_OPENSEARCH_URL: http://opensearch:9200
      # Defaults to the bundled MinIO for local development, but MUST stay
      # overridable: unlike the datastores below, object storage is genuinely
      # external in production (Wasabi). Hardcoding it silently overrode .env and
      # sent Wasabi credentials to the MinIO container, which answers
      # InvalidAccessKeyId — a confusing error for a config precedence problem.
      CDFIR_S3_ENDPOINT: ${CDFIR_S3_ENDPOINT:-http://minio:9000}
      CDFIR_CLAMAV_HOST: clamav
      CDFIR_TIKA_URL: http://tika:9998
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /readyz, not /healthz: liveness only reports uptime, so a worker whose
      # database client is broken still answers 200. That masked a total outage
      # — the Prisma engine was missing and every job failed — while docker ps
      # showed "healthy". Readiness checks postgres, redis and the dispatcher.
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5100/readyz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['app']

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      # Baked into the browser bundle at build time (Next inlines NEXT_PUBLIC_*).
      # Change these -> rebuild the image, not just restart it.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_AUTHENTIK_URL: ${NEXT_PUBLIC_AUTHENTIK_URL:-http://localhost:9443}
    env_file: ../../.env
    ports:
      - '127.0.0.1:${CDFIR_WEB_HOST_PORT:-3000}:3000'
    depends_on:
      - api
    profiles: ['app']

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
  minio-data:
  clamav-data:
  authentik-pg-data:
