# AEG-CloudDFIR staging: a second copy of the app on the same host.
#
#   cd /var/www/AEGCloudDFIR/infra/compose
#   docker compose -p cdfir-staging --env-file ../../.env.staging \
#     -f docker-compose.staging.yml up -d
#
# What is SEPARATE from production, and why:
#  - its own PostgreSQL container and volume. Staging must never be able to
#    write to real evidence, and a shared database is one typo away from that.
#  - its own Redis, so a staging job cannot be picked up by a production worker.
#  - its own OpenSearch index prefix AND its own OpenSearch user, limited to
#    cdfir-staging-*.
#  - its own MinIO buckets for evidence, on this host. Production evidence lives
#    in Wasabi and staging has no credentials for it.
#  - its own Authentik application, so its sign-in redirects to staging hosts.
#
# What is SHARED, and why that is safe:
#  - OpenSearch, ClamAV and Tika. They hold no tenant data of their own (the
#    index is namespaced by prefix), they are the memory-hungry parts, and
#    running second copies would cost ~2.5 GB for no isolation gain.
#
# Staging joins the production compose network to reach those three by name.
name: cdfir-staging

networks:
  default:
    name: cdfir_default
    external: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdfir
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CDFIR_LOCAL_PG_SUPER_PASSWORD:?set a staging superuser password}
      CDFIR_DB_PASSWORD: ${CDFIR_DB_PASSWORD:?set a staging database password}
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${CDFIR_PG_HOST_PORT:-55433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cdfir']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - staging-redis-data:/data
    ports:
      - '127.0.0.1:${CDFIR_REDIS_HOST_PORT:-56380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/iangcastill0/aegclouddfir/api:${CDFIR_IMAGE_TAG:-main}
    env_file: ../../.env.staging
    environment:
      # Service names resolve on the shared network: `postgres` and `redis` are
      # THIS project's containers (compose prefers its own), while opensearch,
      # clamav and tika are production's.
      CDFIR_DATABASE_URL: postgresql://cdfir:${CDFIR_DB_PASSWORD}@postgres:5432/cdfir
      CDFIR_DATABASE_MIGRATION_URL: postgresql://cdfir_migrator:${CDFIR_DB_PASSWORD}@postgres:5432/cdfir
      CDFIR_REDIS_URL: redis://redis:6379
      CDFIR_OPENSEARCH_URL: http://opensearch:9200
      CDFIR_TIKA_URL: http://tika:9998
      CDFIR_CLAMAV_HOST: clamav
    ports:
      - '127.0.0.1:${CDFIR_API_HOST_PORT:-4100}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    # Staging runs the SAME image as production, so what is tested here is what
    # ships. Only its configuration differs.
    image: ghcr.io/iangcastill0/aegclouddfir/worker:${CDFIR_IMAGE_TAG:-main}
    env_file: ../../.env.staging
    environment:
      CDFIR_DATABASE_URL: postgresql://cdfir:${CDFIR_DB_PASSWORD}@postgres:5432/cdfir
      CDFIR_DATABASE_MIGRATION_URL: postgresql://cdfir_migrator:${CDFIR_DB_PASSWORD}@postgres:5432/cdfir
      CDFIR_REDIS_URL: redis://redis:6379
      CDFIR_OPENSEARCH_URL: http://opensearch:9200
      CDFIR_TIKA_URL: http://tika:9998
      CDFIR_CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5100/readyz >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 20

  web:
    # A DIFFERENT image from production: Next inlines NEXT_PUBLIC_* at build
    # time, so a staging bundle has to be built with staging URLs. CI publishes
    # it under the -staging suffix.
    image: ghcr.io/iangcastill0/aegclouddfir/web:${CDFIR_IMAGE_TAG:-main}-staging
    env_file: ../../.env.staging
    ports:
      - '127.0.0.1:${CDFIR_WEB_HOST_PORT:-3100}:3000'
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  staging-postgres-data:
  staging-redis-data:
