apiVersion: v1
kind: ConfigMap
metadata:
  name: evidencevault-config
data:
  NODE_ENV: "production"
  EV_API_PORT: "4000"
  EV_API_PUBLIC_URL: "https://api.evidencevault.example.com"
  EV_WEB_PUBLIC_URL: "https://evidencevault.example.com"
  EV_TRUST_PROXY: "true"
  EV_CORS_ALLOWED_ORIGINS: "https://evidencevault.example.com"
  EV_OPENSEARCH_URL: "http://opensearch.data.svc:9200"
  EV_OPENSEARCH_INDEX_PREFIX: "evidencevault"
  # Wasabi: region-specific endpoint; see docs/guides/wasabi-setup.md
  EV_S3_ENDPOINT: "https://s3.us-east-1.wasabisys.com"
  EV_S3_REGION: "us-east-1"
  EV_S3_BUCKET_EVIDENCE: "ev-evidence"
  EV_S3_BUCKET_QUARANTINE: "ev-quarantine"
  EV_S3_FORCE_PATH_STYLE: "false"
  EV_S3_PRESIGN_TTL_SECONDS: "300"
  EV_OIDC_ISSUER: "https://auth.example.com/application/o/evidencevault/"
  EV_OIDC_CLIENT_ID: "evidencevault"
  EV_CLAMAV_HOST: "clamav.data.svc"
  EV_CLAMAV_PORT: "3310"
  EV_CLAMAV_ENABLED: "true"
  EV_TIKA_URL: "http://tika.data.svc:9998"
  EV_LOG_LEVEL: "info"
  EV_METRICS_PORT: "9464"
  EV_DEMO_MODE: "false"
