apiVersion: v1
kind: ConfigMap
metadata:
  name: cdfir-config
data:
  NODE_ENV: 'production'
  CDFIR_API_PORT: '4000'
  CDFIR_API_PUBLIC_URL: 'https://api.cdfir.example.com'
  CDFIR_WEB_PUBLIC_URL: 'https://cdfir.example.com'
  CDFIR_TRUST_PROXY: 'true'
  CDFIR_CORS_ALLOWED_ORIGINS: 'https://cdfir.example.com'
  CDFIR_OPENSEARCH_URL: 'http://opensearch.data.svc:9200'
  CDFIR_OPENSEARCH_INDEX_PREFIX: 'cdfir'
  # Wasabi: region-specific endpoint; see docs/guides/wasabi-setup.md
  CDFIR_S3_ENDPOINT: 'https://s3.us-east-1.wasabisys.com'
  CDFIR_S3_REGION: 'us-east-1'
  CDFIR_S3_BUCKET_EVIDENCE: 'cdfir-evidence'
  CDFIR_S3_BUCKET_QUARANTINE: 'cdfir-quarantine'
  CDFIR_S3_FORCE_PATH_STYLE: 'false'
  CDFIR_S3_PRESIGN_TTL_SECONDS: '300'
  CDFIR_OIDC_ISSUER: 'https://auth.example.com/application/o/cdfir/'
  CDFIR_OIDC_CLIENT_ID: 'cdfir'
  CDFIR_CLAMAV_HOST: 'clamav.data.svc'
  CDFIR_CLAMAV_PORT: '3310'
  CDFIR_CLAMAV_ENABLED: 'true'
  CDFIR_TIKA_URL: 'http://tika.data.svc:9998'
  CDFIR_LOG_LEVEL: 'info'
  CDFIR_METRICS_PORT: '9464'
  CDFIR_DEMO_MODE: 'false'
