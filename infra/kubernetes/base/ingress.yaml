apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdfir
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt # adjust to your issuer
    nginx.ingress.kubernetes.io/proxy-body-size: '16m'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cdfir.example.com, api.cdfir.example.com]
      secretName: cdfir-tls
  rules:
    - host: cdfir.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { name: http } } }
    - host: api.cdfir.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
