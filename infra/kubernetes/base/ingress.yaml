apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evidencevault
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt # adjust to your issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [evidencevault.example.com, api.evidencevault.example.com]
      secretName: evidencevault-tls
  rules:
    - host: evidencevault.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { name: http } } }
    - host: api.evidencevault.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
