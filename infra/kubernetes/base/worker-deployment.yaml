apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: evidencevault, component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: evidencevault, component: worker }
  template:
    metadata:
      labels: { app: evidencevault, component: worker }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9464'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120 # let in-flight items reach a durable checkpoint
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/OWNER/evidencevault-worker:0.1.0
          envFrom:
            - configMapRef: { name: evidencevault-config }
            - secretRef: { name: evidencevault-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: '2', memory: 4Gi } # OCR/conversion headroom
          ports:
            - { containerPort: 5000, name: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 8Gi } # scratch for rasterization/archives
