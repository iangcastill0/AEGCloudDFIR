# Publishes container images for a commit that already passed CI.
#
# Triggered by CI's completion rather than by push, and gated on its
# conclusion, so an image only exists for a green commit. Deploying is a
# separate, manual workflow (deploy.yml) — this one never touches the server.
name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push api, web, worker
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI validated, NOT whatever main points at now: main may
          # have moved on, and publishing that would ship untested code under a
          # tag that claims to be tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/iangcastill0/aegclouddfir/api:sha-${{ steps.sha.outputs.short }}
            ghcr.io/iangcastill0/aegclouddfir/api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/iangcastill0/aegclouddfir/worker:sha-${{ steps.sha.outputs.short }}
            ghcr.io/iangcastill0/aegclouddfir/worker:main
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          # Next inlines NEXT_PUBLIC_* at build time, so these are baked in and
          # a wrong value cannot be fixed by restarting the container — it needs
          # a rebuild. Repository variables, not secrets: they are public URLs,
          # and keeping them out of this file means a domain change needs no
          # code change. Defaults match production so a missing variable does
          # not silently ship a bundle pointing at localhost.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.aegclouddfir.com' }}
            NEXT_PUBLIC_AUTHENTIK_URL=${{ vars.NEXT_PUBLIC_AUTHENTIK_URL || 'https://auth.aegclouddfir.com' }}
          tags: |
            ghcr.io/iangcastill0/aegclouddfir/web:sha-${{ steps.sha.outputs.short }}
            ghcr.io/iangcastill0/aegclouddfir/web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo
            echo "Commit \`${{ github.event.workflow_run.head_sha }}\`"
            echo
            echo "Deploy with the **Deploy** workflow, tag \`sha-${{ steps.sha.outputs.short }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
