name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Typecheck ops scripts
        run: pnpm exec tsc -p scripts/tsconfig.json
      - name: Validate compose file
        run: docker compose -f infra/compose/docker-compose.yml config -q

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cdfir
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create runtime/migrator roles
        run: |
          PGPASSWORD=ci-only psql -h localhost -U postgres -d cdfir <<'SQL'
          CREATE ROLE cdfir_migrator LOGIN PASSWORD 'ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE cdfir LOGIN PASSWORD 'ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE cdfir TO cdfir, cdfir_migrator;
          GRANT CREATE ON DATABASE cdfir TO cdfir_migrator;
          ALTER SCHEMA public OWNER TO cdfir_migrator;
          GRANT USAGE ON SCHEMA public TO cdfir;
          ALTER DEFAULT PRIVILEGES FOR ROLE cdfir_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO cdfir;
          ALTER DEFAULT PRIVILEGES FOR ROLE cdfir_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO cdfir;
          SQL
      - name: Apply migrations
        run: pnpm --filter @aeg-clouddfir/database exec prisma migrate deploy
        env:
          CDFIR_DATABASE_MIGRATION_URL: postgresql://cdfir_migrator:ci-only@localhost:5432/cdfir
      - name: RLS smoke check (runtime role sees zero rows without tenant context)
        run: |
          PGPASSWORD=ci-only psql -h localhost -U cdfir -d cdfir -tAc \
            "SELECT count(*) FROM tenants" | grep -qx 0

  integration:
    name: Integration tests (live services)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cdfir
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bootstrap roles and apply migrations
        run: |
          PGPASSWORD=ci-only psql -h localhost -U postgres -d cdfir <<'SQL'
          CREATE ROLE cdfir_migrator LOGIN PASSWORD 'ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE cdfir LOGIN PASSWORD 'ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE cdfir TO cdfir, cdfir_migrator;
          GRANT CREATE ON DATABASE cdfir TO cdfir_migrator;
          ALTER SCHEMA public OWNER TO cdfir_migrator;
          GRANT USAGE ON SCHEMA public TO cdfir;
          ALTER DEFAULT PRIVILEGES FOR ROLE cdfir_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO cdfir;
          ALTER DEFAULT PRIVILEGES FOR ROLE cdfir_migrator IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO cdfir;
          SQL
          CDFIR_DATABASE_MIGRATION_URL=postgresql://cdfir_migrator:ci-only@localhost:5432/cdfir \
            pnpm --filter @aeg-clouddfir/database exec prisma migrate deploy
      - run: pnpm test:integration
        env:
          CDFIR_IT_DATABASE_URL: postgresql://cdfir:ci-only@localhost:5432/cdfir

  sbom:
    name: SBOM and license report
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sbom:generate
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
